# Cortex on the NAS, driven from your PC through the `synology` Docker context:
#   .\scripts\ps1\deploy-nas.ps1            build on the NAS, folders, config, secrets, pre-flight, start, health check
# By hand, from the repo root (PowerShell; the image is tagged with the VERSION file):
#   $env:CORTEX_VERSION = Get-Content VERSION
#   docker --context synology compose --env-file .env.nas up -d --build
#   docker --context synology compose --env-file .env.nas logs -f cortex
# Setup from nothing: docs/setup-nas.md. Shipping a new version: docs/deployment.md.
#
# Bind-mount paths are resolved by the NAS's Docker daemon, not by this PC, so every
# path in .env.nas is an absolute path on the NAS. The ${...} values themselves are
# read on this PC from .env.nas (gitignored; see .env.nas.example).
services:
  cortex:
    # Built on the NAS from this working copy (Compose sends the build context over the
    # remote Docker API), like flammeau and life-dashboard. Each version keeps its own tag
    # there, so deploy-nas.ps1 -Version can roll back without rebuilding.
    build: .
    image: cortex:${CORTEX_VERSION:?set by deploy-nas.ps1 from the VERSION file}
    container_name: cortex
    restart: unless-stopped
    # The user that owns the folders below; deploy-nas.ps1 sets their owner to this.
    user: "${PUID:?set PUID in .env.nas}:${PGID:?set PGID in .env.nas}"
    ports:
      - "${CORTEX_PORT:?set CORTEX_PORT in .env.nas}:8765"
    environment:
      CORTEX_ENV: nas
      # Read nas.yaml from the mounted config folder instead of the template inside the image.
      CORTEX_OVERRIDE_DIR: /config
      TZ: ${TZ:?set TZ in .env.nas, e.g. America/Toronto}
    volumes:
      # Data: the brain lives in <data>/brain (your Obsidian vault, or empty for a new brain);
      # Cortex keeps its runtime state (API key hashes, power switch) in <data>/cortex.
      - ${CORTEX_DATA_PATH:?set CORTEX_DATA_PATH in .env.nas}:/data
      # Vault kept elsewhere on the NAS? Also mount it straight onto the brain folder:
      # - /volume1/obsidian/claude-brain:/data/brain
      # Config: nas.yaml, uploaded by deploy-nas.ps1 from config/override/nas.local.yaml.
      - ${CORTEX_CONFIG_PATH:?set CORTEX_CONFIG_PATH in .env.nas}:/config:ro
      # Logs: cortex.log, plain text, rotated.
      - ${CORTEX_LOGS_PATH:?set CORTEX_LOGS_PATH in .env.nas}:/logs
      # Secrets: one file per secret (cortex-admin-pwd, cortex-session-key, optional
      # cortex-guest-pwd), owner-only.
      # A read-only folder mount rather than compose `secrets:`, whose file paths the
      # client resolves: with a remote context that would look on this PC, not the NAS.
      - ${CORTEX_SECRETS_PATH:?set CORTEX_SECRETS_PATH in .env.nas}:/run/secrets:ro
