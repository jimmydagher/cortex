# Cortex CI: pull requests and pushes to main run every check. It publishes nothing:
# the image is built on the NAS by scripts/ps1/deploy-nas.ps1 (docs/deployment.md).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the changelog check diffs against the base branch
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Lint, type-check, tests
        run: python scripts/python/check.py
      - name: Vulnerability scan (runtime dependencies)
        run: python -m pip_audit --requirement requirements.txt --no-deps --disable-pip
      - name: Changelog check (pull request)
        if: github.event_name == 'pull_request'
        run: python3 scripts/python/check_changelog.py --pull-request "origin/${{ github.base_ref }}"
      - name: Changelog check (main)
        if: github.event_name == 'push'
        run: python3 scripts/python/check_changelog.py --main
